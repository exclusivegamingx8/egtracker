<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EG Tracker</title>
<style>
html,body{margin:0;height:100%;background:#f6f7fb;overflow:hidden}
iframe{border:0;width:100%;height:100%;display:block}
#help{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);font:13px/1.4 system-ui,sans-serif;color:#475569;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px 12px;display:none}
#help a{color:#2563eb}
</style>
</head>
<body>
<!-- credentialless: the app loads with no Google sign-in attached, so a browser signed in to
     several Google accounts can still open it. The app itself is open to anyone. -->
<iframe id="app" credentialless allow="clipboard-read; clipboard-write" title="EG Tracker"></iframe>
<div id="help">Taking long? <a id="direct" target="_top">Open the tracker directly</a></div>
<script>
var EXEC='https://script.google.com/macros/s/AKfycbwTgZYucFsyv46wu3BBMdvQWjdhM9B2qWpMMEbpLI0dhWrJslxbOR34RqWzSh-Or5cpgA/exec';
var f=document.getElementById('app');
f.src=EXEC+'?door=1';
document.getElementById('direct').href=EXEC;
var seen=false;
setTimeout(function(){if(!seen)document.getElementById('help').style.display='block'},12000);
function keys(){var d={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^eg_/.test(k))d[k]=localStorage.getItem(k)}}catch(e){}return d}
addEventListener('message',function(e){
  var host='';try{host=new URL(e.origin).hostname}catch(x){}
  if(!/\.googleusercontent\.com$/.test(host))return;
  var m=e.data||{};seen=true;document.getElementById('help').style.display='none';
  if(m.eg==='get'){e.source.postMessage({eg:'data',data:keys()},e.origin)}
  else if(m.eg==='put'&&m.data&&typeof m.data==='object'){
    try{
      var old=keys(),k;
      for(k in old)if(!(k in m.data))localStorage.removeItem(k);
      for(k in m.data)if(/^eg_/.test(k)&&typeof m.data[k]==='string'&&m.data[k].length<2000)localStorage.setItem(k,m.data[k]);
    }catch(x){}
  }
});
</script>
</body>
</html>
